<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Community Clinic Health Platform - Seamless doctor appointments, queue tracking with digital tokens, health camp announcements and SDG 3 community wellness." />
  <title>Apna Community Health Platform</title>
  <!-- Modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;5 ,700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Always open in light mode by default; only switch to dark if user manually clicked dark mode -->
  <script>
    (function () {
      try {
        // Clean up legacy auto-saved theme from previous visits
        localStorage.removeItem('Apna_theme_preference');
        const manualTheme = localStorage.getItem('Apna_manual_theme');
        if (manualTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body
  class="bg-[#F4F7F6] text-[#132226] dark:bg-[#0B1114] dark:text-[#F0F7F6] antialiased font-sans selection:bg-[#0F766E] selection:text-[#F4F7F6] min-h-screen transition-colors duration-200">
  <div id="root"></div>
  <div id="google_translate_element"
    style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;z-index:-1;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi',
          autoDisplay: false
        }, 'google_translate_element');
      }
    }
  </script>
  <script type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
